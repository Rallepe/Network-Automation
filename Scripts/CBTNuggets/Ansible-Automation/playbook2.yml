- name: Configure VLANs on Cisco devices
  hosts: switches
  gather_facts: no
  connection: network_cli
  vars:
    ansible_network_os: cisco.ios.ios
  
  tasks:
    - name: Configure VLANs using ios_config
      cisco.ios.ios_config:
        lines: |
          {% for vlan in vlans %}
          vlan {{ vlan.vlan_id }}
            name {{ vlan.name }}
          {% endfor %}
        match: line
        save_when: modified
      
    - name: Verify VLAN configuration
      cisco.ios.ios_command:
        commands:
          - show vlan brief
      register: vlan_output
    
    - name: Display VLAN configuration
      debug:
        msg: "{{ inventory_hostname }}: {{ vlan_output.stdout_lines }}"