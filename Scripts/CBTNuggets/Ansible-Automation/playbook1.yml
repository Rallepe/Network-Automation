---
- name: Configure NTP servers on Cisco devices
  hosts: switches
  gather_facts: no
  
  tasks:
    - name: Configure NTP servers
      cisco.ios.ios_config:
        lines:
          - ntp server 5.6.7.8
          - ntp server 1.2.3.4
        match: line
        save_when: modified
      
    - name: Verify NTP configuration
      cisco.ios.ios_command:
        commands:
          - show ntp associations
      register: ntp_output
    
    - name: Display NTP associations
      debug:
        var: ntp_output.stdout_lines