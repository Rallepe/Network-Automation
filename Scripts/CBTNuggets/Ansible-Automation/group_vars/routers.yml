---
# Cisco device group variables
ansible_user: rasmus
ansible_password: Cisco123
ansible_network_os: ios
ansible_connection: network_cli

# SSH Authentication - Force password auth, disable public key
ansible_ssh_common_args: "-o PubkeyAuthentication=no -o PasswordAuthentication=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

# Optional: Additional connection parameters
ansible_become: yes
ansible_become_method: enable
# ansible_become_password: <enable_password_if_different>

# Optional: SSH parameters
# ansible_port: 22
# ansible_timeout: 30